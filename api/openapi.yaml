openapi: 3.1.0
info:
  title: Gymkhana Database API
  version: 0.2.0
  description: Private API contract for Gymkhana Database.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveHealth
      summary: Check whether the API process is alive
      tags: [Health]
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadyHealth
      summary: Check whether required dependencies are ready
      tags: [Health]
      responses:
        "200":
          description: API and required dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/login:
    get:
      operationId: beginGitHubLogin
      summary: Begin GitHub OAuth authentication
      tags: [Authentication]
      responses:
        "302":
          description: Redirect to GitHub authorization
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /auth/callback:
    get:
      operationId: completeGitHubLogin
      summary: Complete GitHub OAuth authentication
      tags: [Authentication]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Authentication completed and redirected to the application
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: GitHub authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/auth/session:
    get:
      operationId: getAuthSession
      summary: Read the current protected application session
      tags: [Authentication]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated application session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current application session
      tags: [Authentication]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session revoked or already absent
        "503":
          $ref: "#/components/responses/AuthUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gymkhana_session
  responses:
    BadRequest:
      description: Request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The GitHub account is not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthUnavailable:
      description: Authentication is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        request_id:
          type: string
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthUser:
      type: object
      additionalProperties: false
      required: [login, display_name, role]
      properties:
        login:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        role:
          type: string
          enum: [MEMBER, ADMIN, SUPERADMIN]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        request_id:
          type: string
