openapi: 3.1.0
info:
  title: Gymkhana Database API
  version: 0.3.0
  description: Private API contract for Gymkhana Database.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveHealth
      summary: Check whether the API process is alive
      tags: [Health]
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadyHealth
      summary: Check whether required dependencies are ready
      tags: [Health]
      responses:
        "200":
          description: API and required dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/login:
    get:
      operationId: beginGitHubLogin
      summary: Begin GitHub OAuth authentication
      tags: [Authentication]
      responses:
        "302":
          description: Redirect to GitHub authorization
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /auth/callback:
    get:
      operationId: completeGitHubLogin
      summary: Complete GitHub OAuth authentication
      tags: [Authentication]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Authentication completed and redirected to the application
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: GitHub authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/auth/session:
    get:
      operationId: getAuthSession
      summary: Read the current protected application session
      tags: [Authentication]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated application session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current application session
      tags: [Authentication]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session revoked or already absent
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/admin/users:
    get:
      operationId: listUsers
      summary: List application users for access administration
      tags: [Administration]
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Application users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/admin/users/{user_id}/access:
    patch:
      operationId: updateUserAccess
      summary: Update one application user's role and active access
      tags: [Administration]
      security:
        - sessionCookie: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccessUpdate"
      responses:
        "200":
          description: Updated application user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gymkhana_session
  responses:
    BadRequest:
      description: Request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated account is not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource changed concurrently
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Validation:
      description: Submitted values violate an application invariant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthUnavailable:
      description: Authentication is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        request_id:
          type: string
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, user, capabilities]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/AuthUser"
        capabilities:
          $ref: "#/components/schemas/AuthCapabilities"
    AuthCapabilities:
      type: object
      additionalProperties: false
      required: [manage_users]
      properties:
        manage_users:
          type: boolean
    AuthUser:
      type: object
      additionalProperties: false
      required: [login, display_name, role]
      properties:
        login:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        role:
          $ref: "#/components/schemas/UserRole"
    UserRole:
      type: string
      enum: [MEMBER, ADMIN, SUPERADMIN]
    ManagedUser:
      type: object
      additionalProperties: false
      required: [id, login, display_name, role, active, version, protected]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        role:
          $ref: "#/components/schemas/UserRole"
        active:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
        protected:
          type: boolean
    UserListResponse:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ManagedUser"
    UserAccessUpdate:
      type: object
      additionalProperties: false
      required: [role, active, version]
      properties:
        role:
          type: string
          enum: [MEMBER, ADMIN]
        active:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        request_id:
          type: string
