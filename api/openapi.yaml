{
  "openapi": "3.1.0",
  "info":
    {
      "title": "Gymkhana Database API",
      "version": "0.7.0",
      "description": "Private API contract for Gymkhana Database.",
    },
  "servers": [{ "url": "/" }],
  "paths":
    {
      "/health/live":
        {
          "get":
            {
              "operationId": "getLiveHealth",
              "summary": "Check whether the API process is alive",
              "tags": ["Health"],
              "responses":
                {
                  "200":
                    {
                      "description": "API process is alive",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/HealthResponse" } },
                        },
                    },
                },
            },
        },
      "/health/ready":
        {
          "get":
            {
              "operationId": "getReadyHealth",
              "summary": "Check whether required dependencies are ready",
              "tags": ["Health"],
              "responses":
                {
                  "200":
                    {
                      "description": "API and required dependencies are ready",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/HealthResponse" } },
                        },
                    },
                  "503":
                    {
                      "description": "A required dependency is unavailable",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/HealthResponse" } },
                        },
                    },
                },
            },
        },
      "/auth/login":
        {
          "get":
            {
              "operationId": "beginGitHubLogin",
              "summary": "Begin Google OAuth authentication",
              "tags": ["Authentication"],
              "responses":
                {
                  "302": { "description": "Redirect to Google authorization" },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
        },
      "/auth/callback":
        {
          "get":
            {
              "operationId": "completeGitHubLogin",
              "summary": "Complete Google OAuth authentication",
              "tags": ["Authentication"],
              "parameters":
                [
                  {
                    "name": "code",
                    "in": "query",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "state",
                    "in": "query",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "302":
                    { "description": "Authentication completed and redirected to the application" },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "502":
                    {
                      "description": "Google authentication failed",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/ErrorResponse" } },
                        },
                    },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
        },
      "/api/auth/session":
        {
          "get":
            {
              "operationId": "getAuthSession",
              "summary": "Read the current protected application session",
              "tags": ["Authentication"],
              "security": [{ "sessionCookie": [] }],
              "responses":
                {
                  "200":
                    {
                      "description": "Authenticated application session",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/AuthSessionResponse" } },
                        },
                    },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
        },
      "/api/auth/logout":
        {
          "post":
            {
              "operationId": "logout",
              "summary": "Revoke the current application session",
              "tags": ["Authentication"],
              "security": [{ "sessionCookie": [] }],
              "responses":
                {
                  "204": { "description": "Session revoked or already absent" },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
        },
      "/api/admin/users":
        {
          "get":
            {
              "operationId": "listApplicationUsers",
              "summary": "List application users for administration",
              "tags": ["Administration"],
              "security": [{ "sessionCookie": [] }],
              "parameters":
                [
                  {
                    "name": "limit",
                    "in": "query",
                    "schema":
                      {
                        "type": "integer",
                        "format": "int32",
                        "minimum": 1,
                        "maximum": 100,
                        "default": 100,
                      },
                  },
                  {
                    "name": "offset",
                    "in": "query",
                    "schema": { "type": "integer", "format": "int32", "minimum": 0, "default": 0 },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Application users",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/AdminUsersResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
          "post":
            {
              "operationId": "provisionApplicationUser",
              "summary": "Create an application user with role and capabilities",
              "tags": ["Administration"],
              "security": [{ "sessionCookie": [] }],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/ProvisionUserRequest" } },
                    },
                },
              "responses":
                {
                  "201":
                    {
                      "description": "Created application user",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/AdminUser" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "409": { "$ref": "#/components/responses/Conflict" },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
        },
      "/api/admin/users/{user_id}":
        {
          "delete":
            {
              "operationId": "deleteApplicationUser",
              "summary": "Delete an application user",
              "tags": ["Administration"],
              "security": [{ "sessionCookie": [] }],
              "parameters":
                [
                  {
                    "name": "user_id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                ],
              "responses":
                {
                  "204": { "description": "User deleted" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "409": { "$ref": "#/components/responses/Conflict" },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
        },
      "/api/admin/users/{user_id}/access":
        {
          "patch":
            {
              "operationId": "updateApplicationUserAccess",
              "summary": "Update application role and active status",
              "tags": ["Administration"],
              "security": [{ "sessionCookie": [] }],
              "parameters":
                [
                  {
                    "name": "user_id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/UpdateUserAccessRequest" } },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Updated application user",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/AdminUser" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "409": { "$ref": "#/components/responses/Conflict" },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
        },
      "/api/admin/model-keys/{provider}":
        {
          "parameters":
            [
              {
                "name": "provider",
                "in": "path",
                "required": true,
                "schema": { "$ref": "#/components/schemas/ModelProvider" },
              },
            ],
          "get":
            {
              "operationId": "getModelKeyStatus",
              "summary": "Shared Assistente model key status (never the secret)",
              "tags": ["Administration"],
              "security": [{ "sessionCookie": [] }],
              "responses":
                {
                  "200":
                    {
                      "description": "Model key status",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/ModelKeyStatus" } },
                        },
                    },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
          "put":
            {
              "operationId": "setModelKey",
              "summary": "Store or rotate the shared Assistente model key",
              "tags": ["Administration"],
              "security": [{ "sessionCookie": [] }],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/SetModelKeyRequest" } },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Model key status after the update",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/ModelKeyStatus" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ValidationError" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
          "delete":
            {
              "operationId": "clearModelKey",
              "summary": "Remove the shared Assistente model key",
              "tags": ["Administration"],
              "security": [{ "sessionCookie": [] }],
              "responses":
                {
                  "204": { "description": "Model key removed or already absent" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "503": { "$ref": "#/components/responses/AuthUnavailable" },
                },
            },
        },
      "/api/v1/profiles":
        {
          "get":
            {
              "operationId": "listProfiles",
              "summary": "List physical-person profiles",
              "tags": ["Profiles"],
              "security": [{ "sessionCookie": [] }],
              "parameters":
                [
                  {
                    "name": "limit",
                    "in": "query",
                    "schema":
                      {
                        "type": "integer",
                        "format": "int32",
                        "minimum": 1,
                        "maximum": 1000,
                        "default": 100,
                      },
                  },
                  {
                    "name": "offset",
                    "in": "query",
                    "schema": { "type": "integer", "format": "int32", "minimum": 0, "default": 0 },
                  },
                  {
                    "name": "sort",
                    "in": "query",
                    "schema": { "$ref": "#/components/schemas/ProfileSortField" },
                  },
                  {
                    "name": "order",
                    "in": "query",
                    "schema": { "$ref": "#/components/schemas/SortOrder" },
                  },
                  {
                    "name": "q",
                    "in": "query",
                    "description": "Search query language applied as a row recorte of this module.",
                    "schema": { "type": "string", "maxLength": 512 },
                  },
                  { "name": "full_name", "in": "query", "schema": { "type": "string" } },
                  { "name": "cpf", "in": "query", "schema": { "type": "string" } },
                  { "name": "email", "in": "query", "schema": { "type": "string" } },
                  { "name": "city", "in": "query", "schema": { "type": "string" } },
                  {
                    "name": "state",
                    "in": "query",
                    "schema": { "type": "string", "minLength": 2, "maxLength": 2 },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Paginated profile list",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/ProfilePageResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
            },
          "post":
            {
              "operationId": "createProfile",
              "summary": "Create a physical-person profile",
              "tags": ["Profiles"],
              "security": [{ "sessionCookie": [] }],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/ProfileValuesRequest" } },
                    },
                },
              "responses":
                {
                  "201":
                    {
                      "description": "Created profile",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/Profile" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "422": { "$ref": "#/components/responses/ValidationError" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
            },
        },
      "/api/v1/profiles/cities":
        {
          "get":
            {
              "operationId": "listDistinctCities",
              "summary": "List distinct cities across profiles matching the given filters",
              "tags": ["Profiles"],
              "security": [{ "sessionCookie": [] }],
              "parameters":
                [
                  { "name": "full_name", "in": "query", "schema": { "type": "string" } },
                  { "name": "cpf", "in": "query", "schema": { "type": "string" } },
                  { "name": "email", "in": "query", "schema": { "type": "string" } },
                  {
                    "name": "state",
                    "in": "query",
                    "schema": { "type": "string", "minLength": 2, "maxLength": 2 },
                  },
                  {
                    "name": "limit",
                    "in": "query",
                    "schema":
                      {
                        "type": "integer",
                        "format": "int32",
                        "minimum": 1,
                        "maximum": 1000,
                        "default": 500,
                      },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Distinct city names",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/DistinctCitiesResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
            },
        },
      "/api/v1/profiles/{profile_id}":
        {
          "parameters":
            [
              {
                "name": "profile_id",
                "in": "path",
                "required": true,
                "schema": { "type": "string", "format": "uuid" },
              },
            ],
          "get":
            {
              "operationId": "getProfile",
              "summary": "Read one physical-person profile",
              "tags": ["Profiles"],
              "security": [{ "sessionCookie": [] }],
              "responses":
                {
                  "200":
                    {
                      "description": "Profile",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/Profile" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
            },
          "put":
            {
              "operationId": "updateProfile",
              "summary": "Replace canonical profile values using optimistic concurrency",
              "tags": ["Profiles"],
              "security": [{ "sessionCookie": [] }],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/UpdateProfileRequest" } },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Updated profile",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/Profile" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "409": { "$ref": "#/components/responses/Conflict" },
                  "422": { "$ref": "#/components/responses/ValidationError" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
            },
          "delete":
            {
              "operationId": "deleteProfile",
              "summary": "Permanently delete a profile with explicit confirmation",
              "tags": ["Profiles"],
              "security": [{ "sessionCookie": [] }],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/DeleteProfileRequest" } },
                    },
                },
              "responses":
                {
                  "204": { "description": "Profile permanently deleted" },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "409": { "$ref": "#/components/responses/Conflict" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
            },
        },
      "/api/v1/profiles/{profile_id}/duplicate":
        {
          "post":
            {
              "operationId": "duplicateProfile",
              "summary": "Duplicate a profile into an independent profile for review",
              "tags": ["Profiles"],
              "security": [{ "sessionCookie": [] }],
              "parameters":
                [
                  {
                    "name": "profile_id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                ],
              "responses":
                {
                  "201":
                    {
                      "description": "Duplicated profile",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/Profile" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
            },
        },
      "/api/v1/document-types":
        {
          "get":
            {
              "operationId": "listDocumentTypes",
              "summary": "List administrable document types",
              "tags": ["Documents"],
              "parameters":
                [
                  {
                    "name": "limit",
                    "in": "query",
                    "schema":
                      {
                        "type": "integer",
                        "format": "int32",
                        "minimum": 1,
                        "maximum": 1000,
                        "default": 100,
                      },
                  },
                  {
                    "name": "offset",
                    "in": "query",
                    "schema": { "type": "integer", "format": "int32", "minimum": 0, "default": 0 },
                  },
                  {
                    "name": "sort",
                    "in": "query",
                    "schema": { "$ref": "#/components/schemas/DocumentTypeSortField" },
                  },
                  {
                    "name": "order",
                    "in": "query",
                    "schema": { "$ref": "#/components/schemas/SortOrder" },
                  },
                  { "name": "label", "in": "query", "schema": { "type": "string" } },
                  { "name": "active", "in": "query", "schema": { "type": "boolean" } },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Paginated document type list",
                      "content":
                        {
                          "application/json":
                            {
                              "schema": { "$ref": "#/components/schemas/DocumentTypePageResponse" },
                            },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
              "security": [{ "sessionCookie": [] }],
            },
          "post":
            {
              "operationId": "createDocumentType",
              "summary": "Create an administrable document type",
              "tags": ["Documents"],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/DocumentTypeValuesRequest" } },
                    },
                },
              "responses":
                {
                  "201":
                    {
                      "description": "Created document type",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/DocumentType" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "409": { "$ref": "#/components/responses/Conflict" },
                  "422": { "$ref": "#/components/responses/ValidationError" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
              "security": [{ "sessionCookie": [] }],
            },
        },
      "/api/v1/document-types/{document_type_id}":
        {
          "parameters":
            [
              {
                "name": "document_type_id",
                "in": "path",
                "schema": { "type": "string", "format": "uuid" },
                "required": true,
              },
            ],
          "get":
            {
              "operationId": "getDocumentType",
              "summary": "Read one document type",
              "tags": ["Documents"],
              "responses":
                {
                  "200":
                    {
                      "description": "Document type",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/DocumentType" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
              "security": [{ "sessionCookie": [] }],
            },
          "put":
            {
              "operationId": "updateDocumentType",
              "summary": "Replace document type settings using optimistic concurrency",
              "tags": ["Documents"],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/UpdateDocumentTypeRequest" } },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Updated document type",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/DocumentType" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/BadRequest" },
                  "401": { "$ref": "#/components/responses/Unauthorized" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "404": { "$ref": "#/components/responses/NotFound" },
                  "409": { "$ref": "#/components/responses/Conflict" },
                  "422": { "$ref": "#/components/responses/ValidationError" },
                  "503": { "$ref": "#/components/responses/ServiceUnavailable" },
                },
              "security": [{ "sessionCookie": [] }],
            },
          "delete":
