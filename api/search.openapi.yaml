openapi: 3.1.0
info:
  title: Gymkhana Database Search API
  version: 0.8.0
  description: Permission-filtered logical Search contract. Physical schema names and SQL are never accepted.
servers:
  - url: /
paths:
  /api/v1/search/catalog:
    get:
      operationId: getSearchCatalog
      summary: Read the authorized logical Search catalog
      tags: [Search]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Permission-filtered Search catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/search:
    post:
      operationId: executeSearch
      summary: Execute a bounded Search using logical identifiers
      description: Terms are treated as literal character sequences. Results and catalog are permission-filtered.
      tags: [Search]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Deterministic page of explained Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gymkhana_session
  responses:
    BadRequest:
      description: Invalid JSON or request shape
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user cannot access Search or the requested scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Logical identifiers, Search limits, cost, or result cardinality are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Persistent per-user Search rate limit was reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Search failed without exposing physical schema or SQL details
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Search is unavailable or exceeded the safe execution timeout
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SearchModule:
      type: string
      enum: [profiles, documents, bills, custom_data, attachments]
    SearchSortField:
      type: string
      enum: [relevance, updated_at]
    SearchSortOrder:
      type: string
      enum: [asc, desc]
    SearchCatalogModule:
      type: object
      additionalProperties: false
      required: [key, label]
      properties:
        key:
          $ref: "#/components/schemas/SearchModule"
        label:
          type: string
    SearchCatalogField:
      type: object
      additionalProperties: false
      required: [key, module, label, kind]
      properties:
        key:
          type: string
          description: Opaque logical identifier from the authorized catalog.
        module:
          $ref: "#/components/schemas/SearchModule"
        label:
          type: string
        kind:
          type: string
    SearchCatalogLimits:
      type: object
      additionalProperties: false
      required: [maximum_terms, maximum_term_length, maximum_fields, maximum_page_size, maximum_offset, maximum_result_cardinality]
      properties:
        maximum_terms:
          type: integer
          minimum: 1
        maximum_term_length:
          type: integer
          minimum: 1
        maximum_fields:
          type: integer
          minimum: 1
        maximum_page_size:
          type: integer
          format: int32
          minimum: 1
        maximum_offset:
          type: integer
          format: int32
          minimum: 0
        maximum_result_cardinality:
          type: integer
          format: int64
          minimum: 1
    SearchCatalogResponse:
      type: object
      additionalProperties: false
      required: [modules, fields, limits]
      properties:
        modules:
          type: array
          items:
            $ref: "#/components/schemas/SearchCatalogModule"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SearchCatalogField"
        limits:
          $ref: "#/components/schemas/SearchCatalogLimits"
    SearchRequest:
      type: object
      additionalProperties: false
      required: [terms]
      properties:
        terms:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        modules:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SearchModule"
        fields:
          type: array
          maxItems: 40
          uniqueItems: true
          items:
            type: string
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 50
        offset:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          default: 0
        sort:
          allOf:
            - $ref: "#/components/schemas/SearchSortField"
          default: relevance
        order:
          allOf:
            - $ref: "#/components/schemas/SearchSortOrder"
          default: desc
    SearchResult:
      type: object
      additionalProperties: false
      required:
        - module
        - entity_kind
        - entity_id
        - target_kind
        - target_id
        - entity_label
        - field_key
        - field_label
        - preview
        - score
        - updated_at
      properties:
        module:
          $ref: "#/components/schemas/SearchModule"
        entity_kind:
          type: string
          enum: [profile, document, bill, custom_entity, attachment]
        entity_id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        target_kind:
          type: string
          enum: [profile, document, bill, custom_entity]
        target_id:
          type: string
          format: uuid
        entity_label:
          type: string
        field_key:
          type: string
        field_label:
          type: string
        preview:
          type: string
          maxLength: 200
        score:
          type: integer
          format: int32
        updated_at:
          type: string
          format: date-time
    SearchPageMeta:
      type: object
      additionalProperties: false
      required: [total, limit, offset, sort, sort_order]
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SearchSortField"
        sort_order:
          $ref: "#/components/schemas/SearchSortOrder"
    SearchPageResponse:
      type: object
      additionalProperties: false
      required: [results, page]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        page:
          $ref: "#/components/schemas/SearchPageMeta"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
        request_id:
          type: string
        field_errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
