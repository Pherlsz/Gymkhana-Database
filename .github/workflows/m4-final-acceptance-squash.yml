name: M4 final acceptance squash

on:
  pull_request:
    branches:
      - agent/m4-final-acceptance
    paths:
      - ".github/workflows/m4-final-acceptance-squash.yml"

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-final-acceptance
          fetch-depth: 0
      - name: Consolidate against main
        run: |
          git fetch origin main
          git reset --soft origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(m4): complete documents and bills acceptance"
          git push --force origin HEAD:agent/m4-final-acceptance
