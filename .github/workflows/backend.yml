name: Backend

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - "**/*.go"
      - "apps/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: m14-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Enable Corepack
        run: corepack enable

      - name: Configure private Core access
        run: scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          go mod download
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture TypeScript diagnostics
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck:web 2>&1 | tee /tmp/typescript.log

      - name: Capture govulncheck diagnostics
        id: govulncheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./... 2>&1 | tee /tmp/govulncheck.log

      - name: Preserve diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m14-final-diagnostics
          path: |
            /tmp/typescript.log
            /tmp/govulncheck.log
          retention-days: 1
          if-no-files-found: error

      - name: Fail for unresolved diagnostics
        if: ${{ steps.typescript.outcome == 'failure' || steps.govulncheck.outcome == 'failure' }}
        run: exit 1
