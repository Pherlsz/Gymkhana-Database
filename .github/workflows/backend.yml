name: Backend

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/backend.yml"
      - "database/**"
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "deploy/**"
      - "docs/**"

permissions:
  contents: write
  packages: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-google-auth-fix:
    if: ${{ github.event.pull_request.head.ref == 'fix/google-auth-rebuild-migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://gymkhana:gymkhana@localhost:5432/gymkhana?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gymkhana
          POSTGRES_USER: gymkhana
          POSTGRES_PASSWORD: gymkhana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymkhana -d gymkhana"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/google-auth-rebuild-migration
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Configure private dependencies
        run: |
          corepack enable
          scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Apply transformations and regenerate code
        run: |
          python3 scripts/fix-google-auth-consistency.py
          make generate-sql
          gofmt -w $(find cmd internal api/generated -type f -name '*.go')
          pnpm install --frozen-lockfile
          pnpm format
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test TypeScript 7 compatibility
        shell: bash
        run: |
          cp package.json /tmp/package.json.ts6
          cp pnpm-lock.yaml /tmp/pnpm-lock.yaml.ts6
          if pnpm add -Dw typescript@7.0.0 --lockfile-only && pnpm install --frozen-lockfile && pnpm typecheck:web; then
            echo "TypeScript 7.0.0 passed installation and type checking; keeping it."
          else
            echo "TypeScript 7.0.0 remains incompatible; restoring TypeScript 6.0.3."
            cp /tmp/package.json.ts6 package.json
            cp /tmp/pnpm-lock.yaml.ts6 pnpm-lock.yaml
            pnpm install --frozen-lockfile
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify migrations
        run: |
          make migrate
          make migrate-status

      - name: Run Go unit tests
        run: go test ./...

      - name: Run PostgreSQL integration tests
        run: go test -p=1 -tags=integration ./internal/attachment ./internal/search ./internal/operations ./internal/googleforms ./internal/queryengine ./internal/matching ./internal/aichat ./internal/ocr

      - name: Run Go vet and build
        run: |
          go vet ./...
          go build ./cmd/...

      - name: Verify frontend
        run: pnpm check:web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit verified correction
        run: |
          rm -f scripts/fix-google-auth-consistency.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete Google auth migration consistency"
          git push origin HEAD:fix/google-auth-rebuild-migration
