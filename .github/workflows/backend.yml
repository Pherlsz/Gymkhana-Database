name: Backend

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "scripts/configure-private-go.sh"
      - ".github/workflows/backend.yml"
      - "database/migrations/**"
  workflow_dispatch:
    inputs:
      full:
        description: Run race tests in addition to the normal quality checks
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true

      - name: Configure private Core access
        run: bash scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Normalize Go module metadata
        id: modules
        continue-on-error: true
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Preserve normalized Go module metadata
        if: ${{ steps.modules.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: normalized-go-module-metadata
          path: |
            go.mod
            go.sum
          retention-days: 1
          if-no-files-found: error

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        id: formatting
        continue-on-error: true
        shell: bash
        run: |
          unformatted="$(gofmt -l $(find cmd internal api/generated -type f -name '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Prepare formatted Go sources
        if: ${{ steps.formatting.outcome == 'failure' }}
        run: find cmd internal api/generated -type f -name '*.go' -print0 | xargs -0 --no-run-if-empty gofmt -w

      - name: Preserve formatted Go sources
        if: ${{ steps.formatting.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formatted-go-sources
          path: |
            cmd/**/*.go
            internal/**/*.go
            api/generated/**/*.go
          retention-days: 1
          if-no-files-found: error

      - name: Fail when Go formatting differs
        if: ${{ steps.formatting.outcome == 'failure' }}
        run: exit 1

      - name: Run vet
        id: vet
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee /tmp/go-vet.log

      - name: Preserve Go vet diagnostics
        if: ${{ steps.vet.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-vet-diagnostics
          path: /tmp/go-vet.log
          retention-days: 1
          if-no-files-found: error

      - name: Fail when Go vet fails
        if: ${{ steps.vet.outcome == 'failure' }}
        run: exit 1

      - name: Run tests
        run: go test ./...

      - name: Build executables
        run: go build ./cmd/...

      - name: Fail when Go module metadata differs
        if: ${{ steps.modules.outcome == 'failure' }}
        run: exit 1

      - name: Run Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Run race tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: go test -race ./...

