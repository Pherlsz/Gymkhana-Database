name: Backend

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - "**/*.go"
      - "api/**"
      - "apps/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: m14-finalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/m14-advanced-query-tasks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m14-advanced-query-tasks
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Enable Corepack
        run: corepack enable

      - name: Configure private Core access
        run: scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Apply final source and contract fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_idempotent(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing expected source in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          task_page = "apps/web/src/TaskPage.tsx"
          replace_idempotent(
              task_page,
              "void navigate({ search: (previous) => ({ ...previous, draft: created.id, job: undefined }) });",
              "\n".join([
                  "void navigate({",
                  "        search: (previous) => {",
                  "          const next = { ...previous, draft: created.id };",
                  "          delete next.job;",
                  "          return next;",
                  "        },",
                  "      });",
              ]),
          )
          replace_idempotent(
              task_page,
              "\n".join([
                  "    <Page",
                  '      title="Consultas avançadas e tarefas"',
                  '      description="Monte consultas tipadas ou revise uma tarefa completa antes de qualquer execução somente leitura."',
                  "    >",
                  '      <Stack gap="5">',
              ]),
              "\n".join([
                  '    <Page.Root maxWidth="lg">',
                  "      <Page.Header>",
                  "        <Page.Eyebrow>M14 · Consultas avançadas</Page.Eyebrow>",
                  "        <Page.Title>Consultas avançadas e tarefas</Page.Title>",
                  "        <Page.Description>",
                  "          Monte consultas tipadas ou revise uma tarefa completa antes de qualquer execução",
                  "          somente leitura.",
                  "        </Page.Description>",
                  "      </Page.Header>",
                  "      <Page.Content>",
                  '        <Stack gap="5">',
              ]),
          )
          replace_idempotent(task_page, '    <Page.Root maxWidth="xl">', '    <Page.Root maxWidth="lg">')
          replace_idempotent(
              task_page,
              "\n".join(["      </Stack>", "    </Page>"]),
              "\n".join(["        </Stack>", "      </Page.Content>", "    </Page.Root>"]),
          )
          replace_idempotent(task_page, "{row.cells.map((cell) => (", "{(row.cells ?? []).map((cell) => (")
          replace_idempotent(
              "apps/web/src/lib/api/tasks.ts",
              "\n".join([
                  '    throw new APIRequestError("API response is not JSON", {',
                  "      status: response.status,",
                  '      requestId: response.headers.get("x-request-id") ?? undefined,',
                  "    });",
              ]),
              "\n".join([
                  '    throw new APIRequestError("API response is not JSON", {',
                  "      status: response.status,",
                  "      code: undefined,",
                  '      requestId: response.headers.get("x-request-id") ?? undefined,',
                  "    });",
              ]),
          )

          completion = Path("internal/taskengine/postgres_completion.go")
          completion_text = completion.read_text()
          if '"encoding/json"' not in completion_text:
              completion.write_text(completion_text.replace('import (\n\t"context"', 'import (\n\t"context"\n\t"encoding/json"', 1))
          Path("internal/taskengine/json_bridge.go").unlink(missing_ok=True)
          replace_idempotent("internal/taskengine/postgres_jobs.go", "return job.Version + 1", "return job.Version")
          replace_idempotent("internal/queryengine/advanced_service.go", "EntityKind: advanced.EntityKind,", "EntityKind: rootEntity,")
          replace_idempotent("internal/queryengine/advanced_service.go", "if len(parts) < 5 {", "if len(parts) < 4 {")

          contract = Path("api/tasks.openapi.yaml")
          contract_text = contract.read_text()
          empty_rows = "\n".join([
              "        rows:",
              "          type: array",
              "          items:",
              "            type: object",
          ])
          typed_rows = "\n".join([
              "        rows:",
              "          type: array",
              "          maxItems: 100",
              "          items:",
              "            $ref: '#/components/schemas/ResultRow'",
          ])
          if typed_rows not in contract_text:
              if empty_rows not in contract_text:
                  raise SystemExit("query result rows schema not found")
              contract_text = contract_text.replace(empty_rows, typed_rows, 1)
          if "    ResultCell:\n" not in contract_text:
              marker = "    PlanEstimate:\n"
              schemas = """    ResultCell:
              type: object
              additionalProperties: false
              required: [column_position, kind, is_null]
              properties:
                column_position:
                  type: integer
                  minimum: 0
                  maximum: 19
                kind:
                  $ref: '#/components/schemas/ValueKind'
                is_null: { type: boolean }
                text_value: { type: string, maxLength: 5000 }
                integer_value: { type: integer, format: int64 }
                decimal_value:
                  type: string
                  pattern: '^-?[0-9]{1,28}(\\.[0-9]{1,10})?$'
                boolean_value: { type: boolean }
                civil_date_value: { type: string, format: date }
                timestamp_value: { type: string, format: date-time }
            ResultRow:
              type: object
              additionalProperties: false
              required: [position, entity_kind, entity_id, entity_label, updated_at, cells]
              properties:
                position: { type: integer, minimum: 0, maximum: 499 }
                entity_kind: { type: string }
                entity_id: { type: string, minLength: 1, maxLength: 200 }
                entity_label: { type: string, minLength: 1, maxLength: 300 }
                updated_at: { type: string, format: date-time }
                cells:
                  type: array
                  maxItems: 20
                  items:
                    $ref: '#/components/schemas/ResultCell'
          """
              if marker not in contract_text:
                  raise SystemExit("PlanEstimate schema marker not found")
              contract_text = contract_text.replace(marker, schemas + marker, 1)
          contract.write_text(contract_text)
          PY

          gofmt -w internal/taskengine/postgres_completion.go internal/taskengine/postgres_jobs.go internal/queryengine/advanced_service.go
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/backend.yml

      - name: Install dependencies
        run: |
          go mod download
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate task contracts
        shell: bash
        run: |
          tmp="$(mktemp --suffix=.tasks.openapi.yaml)"
          sed 's/^openapi: 3\.1\.0/openapi: 3.0.3/' api/tasks.openapi.yaml > "$tmp"
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.2 --config api/oapi-tasks-codegen.yaml "$tmp"
          rm -f "$tmp"
          pnpm exec openapi-typescript api/tasks.openapi.yaml -o apps/web/src/generated/tasks-api.ts
          gofmt -w api/generated/tasks/tasks.gen.go
          pnpm exec oxfmt apps/web/src/TaskPage.tsx apps/web/src/lib/api/tasks.ts apps/web/src/generated/tasks-api.ts --write

      - name: Verify Go
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l $(find cmd internal api/generated -type f -name '*.go'))"
          go vet ./...
          go test ./...
          go build ./cmd/...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Verify frontend
        run: |
          pnpm typecheck:web
          pnpm lint:web
          pnpm format:check
          pnpm test:web
          pnpm build:web

      - name: Publish verified fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: complete M14 validation and restore CI"
          git push origin HEAD:agent/m14-advanced-query-tasks
