name: Backend

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - "**/*.go"
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: m14-finalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/m14-advanced-query-tasks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m14-advanced-query-tasks
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Enable Corepack
        run: corepack enable

      - name: Apply final source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_idempotent(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing expected source in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_idempotent(
              "apps/web/src/TaskPage.tsx",
              "void navigate({ search: (previous) => ({ ...previous, draft: created.id, job: undefined }) });",
              "\n".join([
                  "void navigate({",
                  "        search: (previous) => {",
                  "          const next = { ...previous, draft: created.id };",
                  "          delete next.job;",
                  "          return next;",
                  "        },",
                  "      });",
              ]),
          )
          replace_idempotent(
              "apps/web/src/TaskPage.tsx",
              "\n".join([
                  "    <Page",
                  '      title="Consultas avançadas e tarefas"',
                  '      description="Monte consultas tipadas ou revise uma tarefa completa antes de qualquer execução somente leitura."',
                  "    >",
                  '      <Stack gap="5">',
              ]),
              "\n".join([
                  '    <Page.Root maxWidth="xl">',
                  "      <Page.Header>",
                  "        <Page.Eyebrow>M14 · Consultas avançadas</Page.Eyebrow>",
                  "        <Page.Title>Consultas avançadas e tarefas</Page.Title>",
                  "        <Page.Description>",
                  "          Monte consultas tipadas ou revise uma tarefa completa antes de qualquer execução",
                  "          somente leitura.",
                  "        </Page.Description>",
                  "      </Page.Header>",
                  "      <Page.Content>",
                  '        <Stack gap="5">',
              ]),
          )
          replace_idempotent(
              "apps/web/src/TaskPage.tsx",
              "\n".join(["      </Stack>", "    </Page>"]),
              "\n".join(["        </Stack>", "      </Page.Content>", "    </Page.Root>"]),
          )
          replace_idempotent(
              "apps/web/src/TaskPage.tsx",
              "{row.cells.map((cell) => (",
              "{(row.cells ?? []).map((cell) => (",
          )
          replace_idempotent(
              "apps/web/src/lib/api/tasks.ts",
              "\n".join([
                  '    throw new APIRequestError("API response is not JSON", {',
                  "      status: response.status,",
                  '      requestId: response.headers.get("x-request-id") ?? undefined,',
                  "    });",
              ]),
              "\n".join([
                  '    throw new APIRequestError("API response is not JSON", {',
                  "      status: response.status,",
                  "      code: undefined,",
                  '      requestId: response.headers.get("x-request-id") ?? undefined,',
                  "    });",
              ]),
          )

          completion = Path("internal/taskengine/postgres_completion.go")
          completion_text = completion.read_text()
          if '"encoding/json"' not in completion_text:
              completion.write_text(
                  completion_text.replace(
                      'import (\n\t"context"',
                      'import (\n\t"context"\n\t"encoding/json"',
                      1,
                  )
              )

          Path("internal/taskengine/json_bridge.go").unlink(missing_ok=True)
          replace_idempotent(
              "internal/taskengine/postgres_jobs.go",
              "return job.Version + 1",
              "return job.Version",
          )
          replace_idempotent(
              "internal/queryengine/advanced_service.go",
              "EntityKind: advanced.EntityKind,",
              "EntityKind: rootEntity,",
          )
          replace_idempotent(
              "internal/queryengine/advanced_service.go",
              "if len(parts) < 5 {",
              "if len(parts) < 4 {",
          )
          PY

          gofmt -w internal/taskengine/postgres_completion.go internal/taskengine/postgres_jobs.go internal/queryengine/advanced_service.go
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/backend.yml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format frontend sources
        run: pnpm exec oxfmt apps/web/src/TaskPage.tsx apps/web/src/lib/api/tasks.ts --write

      - name: Verify frontend with diagnostics
        id: frontend
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            echo '=== TYPECHECK ==='
            pnpm typecheck:web || status=1
            echo '=== LINT ==='
            pnpm lint:web || status=1
            echo '=== FORMAT ==='
            pnpm format:check || status=1
            echo '=== TESTS ==='
            pnpm test:web || status=1
            echo '=== BUILD ==='
            pnpm build:web || status=1
            exit "$status"
          } 2>&1 | tee /tmp/m14-frontend.log

      - name: Preserve frontend diagnostics
        if: ${{ steps.frontend.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m14-frontend-diagnostics
          path: /tmp/m14-frontend.log
          retention-days: 1
          if-no-files-found: error

      - name: Fail when frontend verification fails
        if: ${{ steps.frontend.outcome == 'failure' }}
        run: exit 1

      - name: Publish verified fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: complete M14 validation and restore CI"
          git push origin HEAD:agent/m14-advanced-query-tasks
