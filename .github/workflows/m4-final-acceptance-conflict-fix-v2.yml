name: M4 final acceptance conflict fix v2

on:
  pull_request:
    branches:
      - agent/m4-final-acceptance
    paths:
      - ".github/workflows/m4-final-acceptance-conflict-fix-v2.yml"
      - "scripts/fix_m4_final_acceptance_v2.py"

permissions:
  contents: write
  packages: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out helper branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-final-acceptance-conflict-fix-v2
          path: helper
      - name: Check out product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-final-acceptance
          path: product
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: product
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply fix
        working-directory: product
        run: python3 ../helper/scripts/fix_m4_final_acceptance_v2.py
      - name: Format
        working-directory: product
        run: pnpm format
      - name: Typecheck
        working-directory: product
        run: pnpm typecheck:web
      - name: Lint
        working-directory: product
        run: pnpm lint:web
      - name: Check formatting
        working-directory: product
        run: pnpm format:check
      - name: Test
        working-directory: product
        run: pnpm test:web
      - name: Build
        working-directory: product
        run: pnpm build:web
      - name: Publish product branch
        working-directory: product
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix(records-ui): restore remote value after inline conflict"
          git push origin HEAD:agent/m4-final-acceptance
