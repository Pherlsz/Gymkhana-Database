name: Security

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - "**/*.go"
      - "apps/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/configure-private-go.sh"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "23 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Configure private Core access
        run: scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download Go dependencies
        run: go mod download

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Run OSV-Scanner
        run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0 scan source --recursive .

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high
