name: M5 bootstrap

on:
  push:
    branches:
      - agent/m5-typed-custom-data
    paths:
      - ".github/workflows/m5-bootstrap.yml"

permissions:
  contents: write
  packages: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gymkhana
          POSTGRES_USER: gymkhana
          POSTGRES_PASSWORD: gymkhana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymkhana -d gymkhana"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out M5 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m5-typed-custom-data
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Configure private Core access
        run: scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Materialize typed custom data foundation
        run: |
          cat > /tmp/m5-bootstrap.b64 <<'ARCHIVE'
          
          ARCHIVE
          base64 --decode /tmp/m5-bootstrap.b64 > /tmp/m5-bootstrap.tar.gz
          tar -xzf /tmp/m5-bootstrap.tar.gz
          gofmt -w internal/customdata
      - name: Validate domain contracts
        run: |
          go test ./internal/customdata
          go vet ./internal/customdata
      - name: Validate migration
        run: |
          go run github.com/jackc/tern/v2@v2.4.1 migrate --migrations database/migrations --config database/tern.conf
          go run github.com/jackc/tern/v2@v2.4.1 status --migrations database/migrations --config database/tern.conf
      - name: Publish foundation and remove bootstrap
        run: |
          rm .github/workflows/m5-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/migrations/008_custom_data.sql internal/customdata .github/workflows/m5-bootstrap.yml
          git commit -m "feat(customdata): add typed persistence foundation"
          git push origin HEAD:agent/m5-typed-custom-data
