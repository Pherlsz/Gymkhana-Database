name: Temporary Google auth consistency fix

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - scripts/fix-google-auth-consistency.py
      - .github/workflows/temporary-google-auth-fix.yml

permissions:
  contents: write
  packages: read

jobs:
  fix:
    if: ${{ github.event.pull_request.head.ref == 'fix/google-auth-rebuild-migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://gymkhana:gymkhana@localhost:5432/gymkhana?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gymkhana
          POSTGRES_USER: gymkhana
          POSTGRES_PASSWORD: gymkhana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymkhana -d gymkhana"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/google-auth-rebuild-migration
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Configure dependencies
        run: |
          corepack enable
          scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Apply and format corrections
        run: |
          python3 scripts/fix-google-auth-consistency.py
          make generate-sql
          gofmt -w $(find cmd internal api/generated -type f -name '*.go')
          pnpm install --frozen-lockfile
          pnpm format
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test TypeScript 7
        shell: bash
        run: |
          cp package.json /tmp/package.json.ts6
          cp pnpm-lock.yaml /tmp/pnpm-lock.yaml.ts6
          if pnpm add -Dw typescript@7.0.0 --lockfile-only && pnpm install --frozen-lockfile && pnpm typecheck:web; then
            echo "TypeScript 7.0.0 passed installation and type checking; keeping it."
          else
            echo "TypeScript 7.0.0 remains incompatible; restoring TypeScript 6.0.3."
            cp /tmp/package.json.ts6 package.json
            cp /tmp/pnpm-lock.yaml.ts6 pnpm-lock.yaml
            pnpm install --frozen-lockfile
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify application
        run: |
          make migrate
          make migrate-status
          go test ./...
          go test -p=1 -tags=integration ./internal/attachment ./internal/search ./internal/operations ./internal/googleforms ./internal/queryengine ./internal/matching ./internal/aichat ./internal/ocr
          go vet ./...
          go build ./cmd/...
          pnpm check:web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit correction
        run: |
          rm scripts/fix-google-auth-consistency.py .github/workflows/temporary-google-auth-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete Google auth migration consistency"
          git push origin HEAD:fix/google-auth-rebuild-migration
