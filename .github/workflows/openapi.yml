name: OpenAPI

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - "api/**"
      - "apps/web/src/generated/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Makefile"
      - "scripts/configure-private-go.sh"
      - ".github/workflows/openapi.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: openapi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated-contracts:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Enable Corepack
        run: corepack enable

      - name: Configure private Core access
        run: scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          go mod download
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate OpenAPI clients
        id: regenerate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            make generate-go generate-ts
            find api/generated -type f -name '*.go' -print0 | xargs -0 --no-run-if-empty gofmt -w
            pnpm exec oxfmt apps/web/src/generated/api.ts apps/web/src/generated/attachments-api.ts apps/web/src/generated/search-api.ts apps/web/src/generated/operations-api.ts apps/web/src/generated/google-forms-api.ts apps/web/src/generated/query-api.ts apps/web/src/generated/matching-api.ts apps/web/src/generated/chat-api.ts apps/web/src/generated/ocr-api.ts apps/web/src/generated/tasks-api.ts --write
          } 2>&1 | tee /tmp/openapi-generation.log

      - name: Preserve OpenAPI generator diagnostics
        if: ${{ steps.regenerate.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-generation-diagnostics
          path: /tmp/openapi-generation.log
          retention-days: 1
          if-no-files-found: error

      - name: Fail when OpenAPI generation fails
        if: ${{ steps.regenerate.outcome == 'failure' }}
        run: exit 1

      - name: Verify generated files
        id: generated
        continue-on-error: true
        shell: bash
        run: |
          status="$(git status --porcelain -- api/generated apps/web/src/generated)"
          if [ -n "$status" ]; then
            echo "Generated contract drift:"
            echo "$status"
            exit 1
          fi

      - name: Preserve regenerated contract sources
        if: ${{ steps.generated.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-contract-sources
          path: |
            api/generated
            apps/web/src/generated
          retention-days: 1
          if-no-files-found: error

      - name: Fail when generated contracts differ
        if: ${{ steps.generated.outcome == 'failure' }}
        run: exit 1
