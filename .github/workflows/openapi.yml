name: OpenAPI

on:
  pull_request:
    paths:
      - "api/**"
      - "apps/web/src/generated/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Makefile"
      - ".github/workflows/openapi.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "apps/web/src/generated/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Makefile"
      - ".github/workflows/openapi.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          go mod download
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate OpenAPI clients
        run: |
          make generate-go generate-ts
          find api/generated/go -type f -name '*.go' -print0 | xargs -0 --no-run-if-empty gofmt -w
          pnpm exec oxfmt apps/web/src/generated/api.ts --write

      - name: Verify generated files
        run: git diff --exit-code -- api/generated/go apps/web/src/generated/api.ts
