name: M5 workspace export

on:
  push:
    branches:
      - agent/m5-completion

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create workspace archive
        run: |
          tar --exclude=.git -czf /tmp/gymkhana-database-workspace.tar.gz .
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: m5-workspace
          path: /tmp/gymkhana-database-workspace.tar.gz
          retention-days: 1
