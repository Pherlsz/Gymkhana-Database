name: M4 profile records UI diagnostics

on:
  pull_request:
    branches:
      - agent/m4-profile-records-ui
    paths:
      - ".github/workflows/m4-profile-records-ui-diagnostics.yml"

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out helper branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-profile-records-ui-helper-v3
          path: helper
      - name: Check out target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-profile-records-ui
          path: target
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrate and validate
        working-directory: target
        run: |
          set +e
          {
            python3 ../helper/scripts/patch_m4_profile_records_ui.py &&
            python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/ProfileRecordsPanel.tsx")
          text = path.read_text(encoding="utf-8")
          for old, new in (
              ("onTypes?: () => void;", "onTypes: (() => void) | undefined;"),
              ("record?: DocumentRecord;", "record: DocumentRecord | undefined;"),
              ("record?: BillRecord;", "record: BillRecord | undefined;"),
              ("record?: T;", "record: T | undefined;"),
          ):
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
            pnpm exec oxfmt apps/web/src/ProfilesPage.tsx apps/web/src/ProfileRecordsPanel.tsx apps/web/src/ProfileRecordsPanel.test.tsx apps/web/src/lib/api/client.ts apps/web/src/styles.css --write &&
            pnpm typecheck:web &&
            pnpm lint:web &&
            pnpm test:web -- --run &&
            pnpm build:web
          } > /tmp/m4-profile-records-ui.log 2>&1
          status=$?
          cat /tmp/m4-profile-records-ui.log
          exit $status
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-profile-records-ui-diagnostics
          path: /tmp/m4-profile-records-ui.log
          if-no-files-found: ignore
          retention-days: 1
