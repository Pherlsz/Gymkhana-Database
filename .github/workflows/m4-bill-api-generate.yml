name: M4 bill API generation

on:
  pull_request:
    branches:
      - agent/m4-bill-api
    paths:
      - ".github/workflows/m4-bill-api-generate.yml"
      - "scripts/generate_m4_bill_go.py"
      - "scripts/generate_m4_bill_openapi.py"
      - "scripts/prepare_m4_bill_generator.py"
      - "scripts/postprocess_m4_bill.py"

permissions:
  contents: write
  packages: read

concurrency:
  group: m4-bill-api-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out helper branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/m4-bill-api-generate
          path: helper
      - name: Check out clean main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          path: target
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache-dependency-path: target/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack
        run: corepack enable
      - name: Configure private Core access
        working-directory: target
        run: scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        working-directory: target
        run: |
          go mod download
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate M4.3 source and contracts
        working-directory: target
        run: |
          set -o pipefail
          {
            python3 ../helper/scripts/prepare_m4_bill_generator.py
            python3 ../helper/scripts/generate_m4_bill_go.py
            python3 ../helper/scripts/generate_m4_bill_openapi.py
            python3 ../helper/scripts/postprocess_m4_bill.py
            make generate-sql generate-go generate-ts
            find cmd internal api/generated/go -type f -name '*.go' -print0 | xargs -0 --no-run-if-empty gofmt -w
            pnpm exec oxfmt apps/web/src/generated/api.ts --write
          } 2>&1 | tee /tmp/m4-bill-generate.log
      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-bill-generate-log
          path: /tmp/m4-bill-generate.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Validate generated implementation
        working-directory: target
        run: |
          set -o pipefail
          {
            go test ./...
            go vet ./...
            pnpm typecheck:web
            pnpm test:web -- --run
          } 2>&1 | tee /tmp/m4-bill-validation.log
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-bill-validation-log
          path: /tmp/m4-bill-validation.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Publish target branch
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          required_files=(
            CHANGELOG.md
            api/openapi.yaml
            api/generated/go/api.gen.go
            apps/web/src/generated/api.ts
            internal/bill/service.go
            internal/bill/service_test.go
            internal/bill/audit_store.go
            internal/bill/audit_store_test.go
            internal/platform/httpserver/bill.go
            internal/platform/httpserver/bill_helpers.go
            internal/platform/httpserver/bill_test.go
            database/migrations/007_bill_api_audit.sql
            internal/platform/postgres/dbgen/bill_audit.sql.go
          )
          for file in "${required_files[@]}"; do test -f "$file"; done
          git add -A
          git diff --cached --name-status | tee /tmp/m4-bill-publish.log
          for file in "${required_files[@]}"; do git diff --cached --name-only | grep -Fx "$file" >/dev/null; done
          git commit -m "feat(bills): add protected CRUD and current-use API"
          git push --force origin HEAD:agent/m4-bill-api
      - name: Upload publish manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-bill-publish-manifest
          path: /tmp/m4-bill-publish.log
          if-no-files-found: ignore
          retention-days: 1
