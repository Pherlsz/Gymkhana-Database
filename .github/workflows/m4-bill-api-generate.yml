name: M4 bill API generation

on:
  pull_request:
    branches:
      - agent/m4-bill-api
    paths:
      - ".github/workflows/m4-bill-api-generate.yml"
      - "scripts/generate_m4_bill_go.py"
      - "scripts/generate_m4_bill_openapi.py"

permissions:
  contents: write
  packages: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out helper branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/m4-bill-api-generate
          path: helper
      - name: Check out target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/m4-bill-api
          path: target
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache-dependency-path: target/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack
        run: corepack enable
      - name: Configure private Core access
        working-directory: target
        run: scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        working-directory: target
        run: |
          go mod download
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate M4.3 source and contracts
        working-directory: target
        run: |
          set +e
          { python3 ../helper/scripts/generate_m4_bill_go.py; python3 ../helper/scripts/generate_m4_bill_openapi.py; make generate-sql generate-go generate-ts; find cmd internal api/generated/go -type f -name '*.go' -print0 | xargs -0 --no-run-if-empty gofmt -w; pnpm exec oxfmt apps/web/src/generated/api.ts --write; } > /tmp/m4-bill-generate.log 2>&1
          status=$?
          cat /tmp/m4-bill-generate.log
          exit $status
      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-bill-generate-log
          path: /tmp/m4-bill-generate.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Validate generated implementation
        working-directory: target
        run: |
          set +e
          { go test ./...; go vet ./...; pnpm typecheck:web; pnpm test:web -- --run; } > /tmp/m4-bill-validation.log 2>&1
          status=$?
          cat /tmp/m4-bill-validation.log
          exit $status
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-bill-validation-log
          path: /tmp/m4-bill-validation.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Publish target branch
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          git status --short
          git commit -m "feat(bills): complete protected CRUD and current-use API"
          git push origin HEAD:agent/m4-bill-api
