name: M4 profile records UI helper v3

on:
  pull_request:
    branches:
      - agent/m4-profile-records-ui
    paths:
      - ".github/workflows/m4-profile-records-ui-helper-v3.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: m4-profile-records-ui-helper-v3
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out helper branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-profile-records-ui-helper-v3
          path: helper
      - name: Check out target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-profile-records-ui
          path: target
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrate Profile records UI
        working-directory: target
        run: |
          python3 ../helper/scripts/patch_m4_profile_records_ui.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/ProfileRecordsPanel.tsx")
          text = path.read_text(encoding="utf-8")
          for old, new in (
              ("onTypes?: () => void;", "onTypes: (() => void) | undefined;"),
              ("record?: DocumentRecord;", "record: DocumentRecord | undefined;"),
              ("record?: BillRecord;", "record: BillRecord | undefined;"),
              ("record?: T;", "record: T | undefined;"),
          ):
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          pnpm exec oxfmt apps/web/src/ProfilesPage.tsx apps/web/src/ProfileRecordsPanel.tsx apps/web/src/ProfileRecordsPanel.test.tsx apps/web/src/lib/api/client.ts apps/web/src/styles.css --write
      - name: Validate frontend
        working-directory: target
        run: |
          pnpm typecheck:web
          pnpm lint:web
          pnpm test:web -- --run
          pnpm build:web
      - name: Publish target branch
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(records-ui): integrate Profile document and bill management"
          git push origin HEAD:agent/m4-profile-records-ui
