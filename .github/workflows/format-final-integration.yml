name: Format final integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: read

concurrency:
  group: format-final-integration
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'chore/integrate-foundation-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out integration branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: chore/integrate-foundation-releases

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format and commit
        run: |
          pnpm format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Workspace already formatted."
          else
            git commit -m "style: format foundation integration"
            git push origin HEAD:chore/integrate-foundation-releases
          fi
