name: M4 final acceptance formatter

on:
  pull_request:
    branches:
      - agent/m4-final-acceptance
    paths:
      - ".github/workflows/m4-final-acceptance-format.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: m4-final-acceptance-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-final-acceptance
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Format and publish
        run: |
          pnpm format
          pnpm format:check
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(m4): apply acceptance formatting"
          git push origin HEAD:agent/m4-final-acceptance
