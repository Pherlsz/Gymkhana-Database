name: Migrations

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - "database/**"
      - "internal/platform/postgres/dbgen/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/migrations.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: migrations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://gymkhana:gymkhana@localhost:5432/gymkhana?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gymkhana
          POSTGRES_USER: gymkhana
          POSTGRES_PASSWORD: gymkhana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymkhana -d gymkhana"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Configure private Core access
        run: scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Apply migrations
        run: make migrate

      - name: Check migration status
        run: make migrate-status

      - name: Verify latest migration rollback and reapply
        run: |
          make migrate-down-one
          make migrate
          make migrate-status

      - name: Regenerate sqlc output
        run: |
          make generate-sql
          find internal/platform/postgres/dbgen -type f -name '*.go' -print0 | xargs -0 --no-run-if-empty gofmt -w

      - name: Verify generated files
        run: git diff --exit-code -- internal/platform/postgres/dbgen
