name: M3 lockfile generation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m3-lockgen.yml"
      - "apps/web/package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write
  packages: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out helper branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack
        run: corepack enable
      - name: Generate deterministic lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish lockfile to Profile UI branch
        run: |
          cp pnpm-lock.yaml /tmp/pnpm-lock.yaml
          git fetch origin agent/m3-profile-ui
          git checkout -B agent/m3-profile-ui origin/agent/m3-profile-ui
          cp /tmp/pnpm-lock.yaml pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(web): synchronize TanStack lockfile"
          git push origin HEAD:agent/m3-profile-ui
