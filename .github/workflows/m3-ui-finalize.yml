name: M3 UI finalize

on:
  pull_request:
    branches:
      - main
      - agent/m3-profile-api
    paths:
      - ".github/workflows/m3-ui-finalize.yml"
      - "apps/web/src/**"

permissions:
  contents: write
  packages: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add @tanstack/react-query@latest @tanstack/react-router@latest @tanstack/react-table@latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Format and validate
        run: |
          pnpm exec oxfmt apps/web/src/App.tsx apps/web/src/ProfilesPage.tsx apps/web/src/App.test.tsx apps/web/src/lib/api/client.ts --write
          pnpm typecheck:web
          pnpm lint:web
          pnpm test:web
          pnpm build:web
      - name: Finalize source branch
        run: |
          rm .github/workflows/m3-ui-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(profile): add responsive management experience"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
