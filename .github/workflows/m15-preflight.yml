name: M15 draft preflight

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/m15-preflight.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: m15-draft-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-images:
    if: ${{ github.event.pull_request.draft && github.event.pull_request.head.ref == 'agent/m15-hardening-migration-launch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve diagnostic release metadata
        id: release
        shell: bash
        run: |
          echo "version=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/m15-images

      - name: Build API image
        id: api
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker build \
            --progress=plain \
            --secret id=github_token,env=GYMKHANA_REPOSITORY_TOKEN \
            --build-arg RELEASE_VERSION=${{ steps.release.outputs.version }} \
            --build-arg RELEASE_COMMIT=${{ steps.release.outputs.commit }} \
            --build-arg RELEASE_BUILT_AT=${{ steps.release.outputs.built_at }} \
            -f Dockerfile.api \
            -t gymkhana-database-api:${{ steps.release.outputs.commit }} . \
            2>&1 | tee /tmp/m15-images/api.log

      - name: Build migration image
        id: migrate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker build \
            --progress=plain \
            --secret id=github_token,env=GYMKHANA_REPOSITORY_TOKEN \
            --build-arg RELEASE_VERSION=${{ steps.release.outputs.version }} \
            --build-arg RELEASE_COMMIT=${{ steps.release.outputs.commit }} \
            --build-arg RELEASE_BUILT_AT=${{ steps.release.outputs.built_at }} \
            -f Dockerfile.migrate \
            -t gymkhana-database-migrate:${{ steps.release.outputs.commit }} . \
            2>&1 | tee /tmp/m15-images/migrate.log

      - name: Build worker image
        id: worker
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker build \
            --progress=plain \
            --secret id=github_token,env=GYMKHANA_REPOSITORY_TOKEN \
            --build-arg RELEASE_VERSION=${{ steps.release.outputs.version }} \
            --build-arg RELEASE_COMMIT=${{ steps.release.outputs.commit }} \
            --build-arg RELEASE_BUILT_AT=${{ steps.release.outputs.built_at }} \
            -f Dockerfile.worker \
            -t gymkhana-database-worker:${{ steps.release.outputs.commit }} . \
            2>&1 | tee /tmp/m15-images/worker.log

      - name: Preserve image diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m15-image-diagnostics
          path: /tmp/m15-images
          retention-days: 1
          if-no-files-found: error

      - name: Fail when an image build fails
        if: ${{ steps.api.outcome == 'failure' || steps.migrate.outcome == 'failure' || steps.worker.outcome == 'failure' }}
        run: exit 1
