name: M15 draft preflight

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/m15-preflight.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: m15-draft-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect-images:
    if: ${{ github.event.pull_request.draft && github.event.pull_request.head.ref == 'agent/m15-hardening-migration-launch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and capture image metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m15-image-metadata
          release_version="sha-${GITHUB_SHA::12}"
          release_built_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          printf '%s\n' "$release_version" > /tmp/m15-image-metadata/expected-version.txt
          printf '%s\n' "$GITHUB_SHA" > /tmp/m15-image-metadata/expected-revision.txt
          printf '%s\n' "$release_built_at" > /tmp/m15-image-metadata/expected-created.txt
          for target in api migrate worker; do
            image="gymkhana-database-${target}:${GITHUB_SHA}"
            docker build \
              --secret id=github_token,env=GYMKHANA_REPOSITORY_TOKEN \
              --build-arg RELEASE_VERSION="$release_version" \
              --build-arg RELEASE_COMMIT="$GITHUB_SHA" \
              --build-arg RELEASE_BUILT_AT="$release_built_at" \
              -f "Dockerfile.${target}" \
              -t "$image" .
            docker image inspect "$image" > "/tmp/m15-image-metadata/${target}.json"
            {
              echo "target=$target"
              echo "version=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
              echo "revision=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
              echo "created=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.created" }}')"
              echo "user=$(docker image inspect "$image" --format '{{.Config.User}}')"
            } | tee "/tmp/m15-image-metadata/${target}.txt"
          done

      - name: Preserve image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m15-image-metadata
          path: /tmp/m15-image-metadata
          retention-days: 1
          if-no-files-found: error
