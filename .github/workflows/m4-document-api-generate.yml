name: M4 document API sqlc generation

on:
  pull_request:
    branches:
      - agent/m4-document-api
    paths:
      - ".github/workflows/m4-document-api-generate.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-document-api
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Generate sqlc output
        run: |
          make generate-sql
          find internal/platform/postgres/dbgen -type f -name '*.go' -print0 | xargs -0 --no-run-if-empty gofmt -w
      - name: Publish generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/platform/postgres/dbgen
          git diff --cached --quiet && exit 0
          git commit -m "chore(sqlc): generate document audit queries"
          git push origin HEAD:agent/m4-document-api
