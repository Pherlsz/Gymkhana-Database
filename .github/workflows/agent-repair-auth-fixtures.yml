name: One-shot auth fixture repair

on:
  push:
    branches:
      - agent/login-phase
    paths:
      - .github/workflows/agent-repair-auth-fixtures.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/login-phase
          fetch-depth: 0

      - name: Repair stale auth fixtures and Google Forms actor query
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          fixture_paths = [
              Path("internal/attachment/postgres_store_integration_test.go"),
              Path("internal/search/postgres_store_integration_test.go"),
              Path("internal/operations/postgres_store_integration_test.go"),
              Path("internal/googleforms/postgres_store_integration_test.go"),
              Path("internal/queryengine/postgres_store_integration_test.go"),
              Path("internal/matching/postgres_store_integration_test.go"),
              Path("internal/ocr/postgres_store_integration_test.go"),
          ]

          legacy_insert = re.compile(
              r"\(id,\s*github_user_id,\s*github_login,\s*display_name,\s*role,\s*active\)\s*"
              r"VALUES\(\$1,\$2,\$3,\$4,"
          )
          replacement = (
              "(id, subject, email, display_name, role, active)\n"
              "VALUES($1,$2::text,$3 || '@example.test',$4,"
          )

          for path in fixture_paths:
              text = path.read_text()
              text, count = legacy_insert.subn(replacement, text)
              path.write_text(text)
              print(f"{path}: migrated {count} legacy app_users insert(s)")
              if "github_user_id" in text or "github_login" in text:
                  raise SystemExit(f"legacy GitHub auth column remains in {path}")

          aichat = Path("internal/aichat/postgres_store_integration_test.go")
          text = aichat.read_text()
          text, login_count = re.subn(r"\bLogin:", "Email:", text)
          aichat.write_text(text)
          print(f"{aichat}: migrated {login_count} auth.User Login field(s)")
          if "Login:" in text:
              raise SystemExit(f"legacy auth.User Login field remains in {aichat}")

          sync = Path("internal/googleforms/postgres_sync.go")
          text = sync.read_text()
          old = "SELECT id, github_user_id, github_login, display_name,\n       avatar_url, role, active FROM app_users WHERE id=$1"
          new = "SELECT id, email, display_name,\n       avatar_url, role, active FROM app_users WHERE id=$1"
          if old not in text:
              raise SystemExit("expected legacy Google Forms actor query was not found")
          text = text.replace(old, new, 1)
          sync.write_text(text)
          if "github_user_id" in text or "github_login" in text:
              raise SystemExit("legacy GitHub auth column remains in Google Forms runtime query")
          PY

          gofmt -w \
            internal/attachment/postgres_store_integration_test.go \
            internal/search/postgres_store_integration_test.go \
            internal/operations/postgres_store_integration_test.go \
            internal/googleforms/postgres_store_integration_test.go \
            internal/queryengine/postgres_store_integration_test.go \
            internal/matching/postgres_store_integration_test.go \
            internal/ocr/postgres_store_integration_test.go \
            internal/aichat/postgres_store_integration_test.go \
            internal/googleforms/postgres_sync.go

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/agent-repair-auth-fixtures.yml
          git add internal
          if git diff --cached --quiet; then
            echo "No changes produced by repair"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(auth): migrate stale integration fixtures"
          git push origin HEAD:agent/login-phase
