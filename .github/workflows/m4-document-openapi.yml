name: M4 document HTTP format

on:
  pull_request:
    branches:
      - agent/m4-document-api
    paths:
      - ".github/workflows/m4-document-openapi.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-document-api
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Format and publish HTTP tests
        run: |
          gofmt -w internal/platform/httpserver/document_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/platform/httpserver/document_test.go
          git diff --cached --quiet && exit 0
          git commit -m "test(documents): format HTTP coverage"
          git push origin HEAD:agent/m4-document-api
