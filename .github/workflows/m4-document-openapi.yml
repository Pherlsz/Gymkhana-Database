name: M4 document OpenAPI generation

on:
  pull_request:
    branches:
      - agent/m4-document-api
    paths:
      - ".github/workflows/m4-document-openapi.yml"
      - "scripts/m4_document_openapi.py"

permissions:
  contents: write
  packages: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out helper branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-document-openapi
          path: helper
      - name: Check out target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/m4-document-api
          path: target
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache-dependency-path: target/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack
        run: corepack enable
      - name: Configure private Core access
        working-directory: target
        run: scripts/configure-private-go.sh
        env:
          GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        working-directory: target
        run: |
          go mod download
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Extend contract and generate clients
        working-directory: target
        run: |
          python3 ../helper/scripts/m4_document_openapi.py api/openapi.yaml
          make generate-go generate-ts
          find api/generated/go -type f -name '*.go' -print0 | xargs -0 --no-run-if-empty gofmt -w
          pnpm exec oxfmt apps/web/src/generated/api.ts --write
      - name: Publish generated contracts
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi.yaml api/generated/go apps/web/src/generated/api.ts
          git commit -m "feat(openapi): publish document API contracts"
          git push origin HEAD:agent/m4-document-api
