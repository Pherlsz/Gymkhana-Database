name: M3 Profile UI test diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m3-testdiag.yml"
      - "apps/web/**"
      - "pnpm-lock.yaml"

permissions:
  contents: write
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out helper branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture test output
        run: |
          set +e
          pnpm test:web > m3-test-diagnostic.log 2>&1
          status=$?
          tail -n 240 m3-test-diagnostic.log > m3-test-diagnostic.tail.log
          mv m3-test-diagnostic.tail.log m3-test-diagnostic.log
          echo "$status" > m3-test-status.txt
      - name: Publish diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m3-test-diagnostic.log m3-test-status.txt
          git commit -m "chore: capture M3 Profile UI test diagnostic"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
