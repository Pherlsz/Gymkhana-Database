name: Release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate scripts and Vercel contract
        run: |
          bash -n \
            scripts/configure-worker-schedule.sh \
            scripts/create-recovery-point.sh \
            scripts/promote-cloud-run.sh \
            scripts/rehearse-restore.sh \
            scripts/rollback-cloud-run.sh
          python3 -m py_compile scripts/export-legacy-sqlite.py scripts/render-cloud-run.py
          python3 -m json.tool vercel.json >/dev/null
      - name: Render Cloud Run contracts with immutable fixtures
        env:
          RELEASE_VERSION: sha-304b760a3fff
          GCP_REGION: us-central1
          RUNTIME_SERVICE_ACCOUNT: runtime@example.iam.gserviceaccount.com
          APPLICATION_URL: https://database.example
          API_BASE_URL: https://api.database.example
          R2_ENDPOINT: https://example.r2.cloudflarestorage.com
          R2_BUCKET: private-files
          API_SERVICE_NAME: gymkhana-api
          API_MAX_INSTANCES: "3"
          API_IMAGE_DIGEST: us-central1-docker.pkg.dev/example/app/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WORKER_JOB_NAME: gymkhana-worker
          WORKER_IMAGE_DIGEST: us-central1-docker.pkg.dev/example/app/worker@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          MIGRATION_JOB_NAME: gymkhana-migrate
          MIGRATION_IMAGE_DIGEST: us-central1-docker.pkg.dev/example/app/migrate@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          DATABASE_URL_SECRET: database-url
          DATABASE_URL_SECRET_VERSION: "1"
          GOOGLE_LOGIN_OAUTH_CLIENT_ID_SECRET: google-login-client-id
          GOOGLE_LOGIN_OAUTH_CLIENT_ID_SECRET_VERSION: "1"
          GOOGLE_LOGIN_OAUTH_CLIENT_SECRET_SECRET: google-login-client-secret
          GOOGLE_LOGIN_OAUTH_CLIENT_SECRET_SECRET_VERSION: "1"
          R2_ACCESS_KEY_ID_SECRET: r2-access-key-id
          R2_ACCESS_KEY_ID_SECRET_VERSION: "1"
          R2_SECRET_ACCESS_KEY_SECRET: r2-secret-access-key
          R2_SECRET_ACCESS_KEY_SECRET_VERSION: "1"
        run: |
          python3 scripts/render-cloud-run.py --output-directory .tmp/cloud-run
          test -s .tmp/cloud-run/api.service.yaml
          test -s .tmp/cloud-run/worker.job.yaml
          test -s .tmp/cloud-run/migrate.job.yaml
          ! grep -R '__[A-Z0-9_]*__' .tmp/cloud-run
          ! grep -R 'key: latest' .tmp/cloud-run

  images:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      GYMKHANA_REPOSITORY_TOKEN: ${{ secrets.GYMKHANA_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve immutable release metadata
        id: release
        shell: bash
        run: |
          echo "version=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build release images
        shell: bash
        run: |
          for target in api migrate worker; do
            docker build \
              --secret id=github_token,env=GYMKHANA_REPOSITORY_TOKEN \
              --build-arg RELEASE_VERSION=${{ steps.release.outputs.version }} \
              --build-arg RELEASE_COMMIT=${{ steps.release.outputs.commit }} \
              --build-arg RELEASE_BUILT_AT=${{ steps.release.outputs.built_at }} \
              -f "Dockerfile.${target}" \
              -t "gymkhana-database-${target}:${{ steps.release.outputs.commit }}" .
          done
      - name: Verify immutable metadata and runtime user
        shell: bash
        run: |
          for target in api migrate worker; do
            image="gymkhana-database-${target}:${{ steps.release.outputs.commit }}"
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "${{ steps.release.outputs.version }}"
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${{ steps.release.outputs.commit }}"
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.created" }}')" = "${{ steps.release.outputs.built_at }}"
            test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "nonroot:nonroot"
          done
