name: Release artifacts

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "internal/platform/releaseinfo/**"
      - "scripts/configure-private-go.sh"
      - "scripts/configure-worker-schedule.sh"
      - "scripts/create-recovery-point.sh"
      - "scripts/promote-cloud-run.sh"
      - "scripts/rehearse-restore.sh"
      - "scripts/render-cloud-run.py"
      - "scripts/rollback-cloud-run.sh"
      - "vercel.json"
      - ".github/workflows/release-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: release-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate scripts and Vercel contract
        run: |
          bash -n \
            scripts/configure-worker-schedule.sh \
            scripts/create-recovery-point.sh \
            scripts/promote-cloud-run.sh \
            scripts/rehearse-restore.sh \
            scripts/rollback-cloud-run.sh
          python3 -m py_compile scripts/render-cloud-run.py
          python3 -m json.tool vercel.json >/dev/null

      - name: Render Cloud Run contracts with immutable fixtures
        env:
          RELEASE_VERSION: sha-304b760a3fff
          GCP_REGION: us-central1
          RUNTIME_SERVICE_ACCOUNT: runtime@example.iam.gserviceaccount.com
          APPLICATION_URL: https://database.example
          API_BASE_URL: https://api.database.example
          ALLOWED_EMAILS: developer@gymkhana.example
          SUPERADMIN_EMAIL: developer@gymkhana.example
          R2_ENDPOINT: https://example.r2.cloudflarestorage.com
          R2_BUCKET: private-files
          API_SERVICE_NAME: gymkhana-api
          API_MAX_INSTANCES: "3"
          API_IMAGE_DIGEST: us-central1-docker.pkg.dev/example/app/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WORKER_JOB_NAME: gymkhana-worker
          WORKER_IMAGE_DIGEST: us-central1-docker.pkg.dev/example/app/worker@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          MIGRATION_JOB_NAME: gymkhana-migrate
          MIGRATION_IMAGE_DIGEST: us-central1-docker.pkg.dev/example/app/migrate@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          DATABASE_URL_SECRET: database-url
          DATABASE_URL_SECRET_VERSION: "1"
          GOOGLE_OAUTH_CLIENT_ID_SECRET: google-client-id
          GOOGLE_OAUTH_CLIENT_ID_SECRET_VERSION: "1"
          GOOGLE_OAUTH_CLIENT_SECRET_SECRET: google-client-secret
          GOOGLE_OAUTH_CLIENT_SECRET_SECRET_VERSION: "1"
          R2_ACCESS_KEY_ID_SECRET: r2-access-key-id
          R2_ACCESS_KEY_ID_SECRET_VERSION: "1"
          R2_SECRET_ACCESS_KEY_SECRET: r2-secret-access-key
          R2_SECRET_ACCESS_KEY_SECRET_VERSION: "1"
        run: |
          python3 scripts/render-cloud-run.py --output-directory .tmp/cloud-run
          test -s .tmp/cloud-run/api.service.yaml
          test -s .tmp/cloud-run/worker.job.yaml
          test -s .tmp/cloud-run/migrate.job.yaml
          ! grep -R '__[A-Z0-9_]*__' .tmp/cloud-run
          ! grep -R 'key: latest' .tmp/cloud-run
