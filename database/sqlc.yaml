version: "2"
sql:
  - engine: postgresql
    schema:
      - schema.sql
      - schema_authentication.sql
      - schema_document_audit.sql
      - schema_bill_audit.sql
    queries: queries
    gen:
      go:
        package: dbgen
        out: ../internal/platform/postgres/dbgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
