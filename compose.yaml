services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gymkhana
      POSTGRES_USER: gymkhana
      POSTGRES_PASSWORD: gymkhana
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymkhana -d gymkhana"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
